<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Karya Mahasiswa Magang 1900</title>
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="dns-prefetch" href="https://drive.google.com">
<style>html.gamma-loading body{visibility:hidden}</style>
<script>
/* Loader versi otomatis: ambil version.json (selalu fresh, tanpa cache) lalu
   muat style.css & app.js dengan ?v=<versi>. Jadi tiap ada update cukup ubah
   angka di version.json, pengunjung lama otomatis dapat file terbaru tanpa Ctrl+Shift+R. */
(function () {
  var FALLBACK = "6";
  var root = document.documentElement;
  root.classList.add("gamma-loading");
  var started = false;
  function show() { root.classList.remove("gamma-loading"); }
  setTimeout(show, 3500); // jaga-jaga supaya halaman tidak pernah tersembunyi selamanya
  function start(v) {
    if (started) return;
    started = true;
    var l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "assets/style.css?v=" + v;
    l.onload = l.onerror = show;
    document.head.appendChild(l);
    function addScript() {
      var s = document.createElement("script");
      s.src = "assets/app.js?v=" + v;
      document.body.appendChild(s);
    }
    if (document.body) addScript();
    else document.addEventListener("DOMContentLoaded", addScript);
  }
  var timer = setTimeout(function () { start(FALLBACK); }, 3000);
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(timer); start(String(j.v || FALLBACK)); })
    .catch(function () { clearTimeout(timer); start(FALLBACK); });
})();
</script>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="brand">
      <img src="logo.ico" alt="Logo Gamma" class="brand-logo">
      <div class="brand-text">
        <h1>Gamma</h1>
        <p>Galeri Karya Mahasiswa Magang<span class="brand-dash"> – </span><span class="brand-org">BPS Provinsi Kepulauan Bangka Belitung</span></p>
      </div>
    </div>
    <div class="header-year" id="header-year"></div>
  </div>
  <div class="header-actions" id="header-actions">
    <a href="#" id="login-link">Login</a>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modal-overlay" id="modal-overlay"></div>

<div class="modal-overlay" id="login-overlay">
  <div class="login-box" style="max-width:400px; width:100%;">
    <button class="modal-close" id="login-modal-close" style="float:right;">&times;</button>
    <h2>Login</h2>
    <p style="color:var(--abu); font-size:13.5px; margin-top:-6px; margin-bottom:16px;">Masukkan NIP Anda untuk like &amp; berkomentar.</p>

    <div id="login-input-wrap">
      <label style="text-align:left; display:block; font-size:12px; font-weight:600; color:var(--abu); margin-bottom:4px;">NIP 9 Digit</label>
      <input type="password" id="login-input" placeholder="Masukkan NIP 9 digit">
      <button class="btn btn-primary" style="width:100%; margin-top:12px;" id="btn-login-unified">Masuk</button>
    </div>

    <p class="status-msg" id="login-msg"></p>
  </div>
</div>

</body>
</html>
