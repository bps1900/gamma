<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Gamma</title>
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="logo.ico" alt="Logo Gamma" class="brand-logo">
    <div class="brand-text">
      <h1>Gamma</h1>
      <p>Galeri Karya Mahasiswa Magang – BPS Provinsi Kepulauan Bangka Belitung</p>
    </div>
  </div>
  <div class="header-actions">
    <a href="index.html">Lihat Galeri</a>
  </div>
</header>

<div class="login-wrap">
  <div class="login-box">
    <h2>Login</h2>
    <p style="color:var(--abu); font-size:13px; margin-top:-6px; margin-bottom:14px;">Masukkan NIP Anda untuk like &amp; berkomentar.</p>

    <label style="text-align:left; display:block; font-size:12px; font-weight:600; color:var(--abu); margin-bottom:4px;">NIP 9 Digit</label>
    <input type="password" id="login-input" placeholder="Masukkan NIP 9 digit" autofocus>
    <button class="btn btn-primary" style="width:100%; margin-top:12px;" id="btn-login-unified">Masuk</button>

    <p class="status-msg" id="login-msg"></p>
  </div>
</div>

<script src="assets/app-login.js?v=2"></script>
</body>
</html>
